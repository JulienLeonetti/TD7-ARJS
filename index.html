<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>TD7 — Image Tracking NFT</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="vendor/aframe-ar-nft-3.4.8.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font: 18px sans-serif;
            text-align: center;
            pointer-events: none;
        }
    </style>
    <script>
        (function () {
            var trackingReady = false;
            var modelReady = false;

            function finishLoading() {
                var loader = document.getElementById('loading');
                if (trackingReady && modelReady && loader) loader.remove();
            }

            window.addEventListener('arjs-nft-loaded', function () {
                trackingReady = true;
                finishLoading();
            });

            document.addEventListener('model-loaded', function (event) {
                if (event.target.id !== 'character') return;
                modelReady = true;
                finishLoading();
            });

            document.addEventListener('model-error', function (event) {
                if (event.target.id !== 'character') return;
                document.getElementById('loading').textContent =
                    'Impossible de charger le personnage 3D. Rechargez la page.';
            });

            window.addEventListener('arjs-video-loaded', function (event) {
                var video = event.detail.component;
                video.muted = true;
                video.defaultMuted = true;
                video.playsInline = true;
                video.setAttribute('webkit-playsinline', '');
            });

            window.addEventListener('camera-error', function () {
                var loader = document.getElementById('loading');
                if (loader) loader.textContent =
                    'Autorisez la caméra dans Safari, puis rechargez la page.';
            });
        })();
    </script>
</head>
<body>
    <div id="loading" role="status" aria-live="polite">Chargement, veuillez patienter…</div>

    <a-scene
        embedded
        xr-mode-ui="enabled: false"
        loading-screen="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: medium"
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false">
        <a-nft
            type="nft"
            url="assets/a"
            smooth="true"
            smooth-count="10"
            smooth-tolerance="0.01"
            smooth-threshold="5">
            <!-- Centered on the 768 × 1024, 63 dpi target. The GLB is Y-up. -->
            <a-entity
                id="character"
                gltf-model="assets/fichier.glb"
                position="153 30 -100"
                scale="1.2 1.2 1.2"
                rotation="-90 0 0">
            </a-entity>
        </a-nft>
        <a-entity camera="near: 0.1; far: 10000"></a-entity>
    </a-scene>
</body>
</html>
