<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>TD7 — Image Tracking NFT</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="vendor/aframe-ar-nft-3.4.8.js"></script>
    <script src="vendor/omggif-1.0.10.js"></script>
    <script src="js/animated-gif.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font: 18px sans-serif;
            text-align: center;
            pointer-events: none;
        }
        #ar-diagnostic {
            position: fixed;
            z-index: 10001;
            top: max(8px, env(safe-area-inset-top));
            left: 8px;
            right: 8px;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.82);
            color: #fff;
            font: 12px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
            pointer-events: none;
            white-space: normal;
        }
    </style>
    <script>
        (function () {
            var trackingReady = false;
            var gifReady = false;
            var gifError = null;
            var startedAt = Date.now();
            var seenMarker = false;
            var lastError = '';
            function showDiagnostic() {
                var panel = document.getElementById('ar-diagnostic');
                if (!panel) return;
                panel.textContent = 'Diagnostic v3 | GIF : ' +
                    (gifError ? 'ERREUR ' + gifError : gifReady ? 'OK' : 'en attente') +
                    ' | NFT : ' + (trackingReady ? 'OK' : 'en attente') +
                    ' | Affiche : ' + (seenMarker ? 'reconnue' : 'non reconnue') +
                    (lastError ? ' | JS : ' + lastError : '');
            }
            window.addEventListener('error', function (e) {
                lastError = (e.message || 'erreur JavaScript').slice(0, 150);
                showDiagnostic();
            });
            window.addEventListener('unhandledrejection', function (e) {
                lastError = String(e.reason && e.reason.message || e.reason || 'promise rejetée').slice(0, 150);
                showDiagnostic();
            });

            function finishLoading() {
                var loader = document.getElementById('loading');
                showDiagnostic();
                if (!loader) return;
                if (gifError) {
                    loader.textContent = 'Erreur GIF : ' + gifError;
                } else if (!gifReady && !trackingReady) {
                    loader.textContent = 'Chargement du GIF et du suivi AR…';
                } else if (!gifReady) {
                    loader.textContent = 'Suivi AR prêt. Décodage du GIF…';
                } else if (!trackingReady) {
                    loader.textContent = 'GIF prêt. Initialisation du suivi AR…';
                } else {
                    loader.remove();
                }
            }

            window.addEventListener('arjs-nft-loaded', function () {
                trackingReady = true;
                finishLoading();
            });

            document.addEventListener('gif-loaded', function (event) {
                if (event.target.id !== 'paoli-gif') return;
                gifReady = true;
                finishLoading();
            });

            document.addEventListener('gif-error', function (event) {
                if (event.target.id !== 'paoli-gif') return;
                gifError = event.detail && event.detail.error ? event.detail.error.message : 'chargement impossible';
                finishLoading();
            });

            window.addEventListener('arjs-video-loaded', function (event) {
                var video = event.detail.component;
                video.muted = true;
                video.defaultMuted = true;
                video.playsInline = true;
                video.setAttribute('webkit-playsinline', '');
            });

            document.addEventListener('DOMContentLoaded', function () {
                finishLoading();
                setInterval(showDiagnostic, 2000);
                setTimeout(function () {
                    var loader = document.getElementById('loading');
                    if (!loader) return;
                    var state = 'GIF : ' + (gifError ? 'erreur (' + gifError + ')' : gifReady ? 'prêt' : 'non chargé') +
                        ' | NFT : ' + (trackingReady ? 'prêt' : 'non initialisé');
                    loader.textContent = 'Blocage détecté — ' + state +
                        '. Faites une capture de cet écran.';
                }, 12000);
                var target = document.querySelector('a-nft');
                if (!target) return;
                target.addEventListener('markerFound', function () {
                    seenMarker = true;
                    showDiagnostic();
                    console.info('Affiche NFT reconnue.');
                });
                target.addEventListener('markerLost', function () {
                    seenMarker = false;
                    showDiagnostic();
                    console.info('Affiche perdue : recadrez l’affiche.');
                });
            });

            window.addEventListener('camera-error', function () {
                var loader = document.getElementById('loading');
                if (loader) loader.textContent =
                    'Autorisez la caméra dans Safari, puis rechargez la page.';
            });
        })();
    </script>
</head>
<body>
    <div id="ar-diagnostic" role="status">Diagnostic v3 : démarrage…</div>
    <div id="loading" role="status" aria-live="polite">Chargement, veuillez patienter…</div>

    <a-scene
        embedded
        xr-mode-ui="enabled: false"
        loading-screen="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: medium"
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false">
        <a-nft
            type="nft"
            url="assets/a"
            smooth="true"
            smooth-count="20"
            smooth-tolerance="0.02"
            smooth-threshold="5">
            <!-- GIF at its original aspect ratio, centered just above the poster. -->
            <a-plane
                id="paoli-gif"
                animated-gif="src: assets/paoli-corte.gif"
                width="285"
                height="282.935"
                position="154.82 1 -206.43"
                rotation="-90 0 0"
                material="shader: flat; side: double; transparent: true">
            </a-plane>
        </a-nft>
        <a-entity camera="near: 0.1; far: 10000"></a-entity>
    </a-scene>
</body>
</html>
