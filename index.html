<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>TD7 — Image Tracking NFT</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="vendor/aframe-ar-nft-3.4.8.js"></script>
    <script src="vendor/omggif-1.0.10.js"></script>
    <script src="js/animated-gif.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font: 18px sans-serif;
            text-align: center;
            pointer-events: none;
        }
    </style>
    <script>
        (function () {
            var trackingReady = false;
            var gifReady = false;
            var markerVisible = false;

            function finishLoading() {
                var loader = document.getElementById('loading');
                if (!loader) return;
                if (!gifReady) {
                    loader.textContent = 'Chargement du GIF…';
                } else if (!trackingReady) {
                    loader.textContent = 'Initialisation de la reconnaissance de l’affiche…';
                } else if (!markerVisible) {
                    loader.textContent = 'Pointez la caméra vers l’affiche entière, bien éclairée et sans reflet.';
                } else {
                    loader.remove();
                }
            }

            window.addEventListener('arjs-nft-loaded', function () {
                trackingReady = true;
                finishLoading();
            });

            document.addEventListener('gif-loaded', function (event) {
                if (event.target.id !== 'paoli-gif') return;
                gifReady = true;
                finishLoading();
            });

            document.addEventListener('gif-error', function (event) {
                if (event.target.id !== 'paoli-gif') return;
                var loader = document.getElementById('loading');
                if (loader) loader.textContent = 'Erreur GIF : ' +
                    (event.detail && event.detail.error ? event.detail.error.message : 'chargement impossible');
            });

            window.addEventListener('arjs-video-loaded', function (event) {
                var video = event.detail.component;
                video.muted = true;
                video.defaultMuted = true;
                video.playsInline = true;
                video.setAttribute('webkit-playsinline', '');
            });

            document.addEventListener('DOMContentLoaded', function () {
                var target = document.querySelector('a-nft');
                if (!target) return;
                target.addEventListener('markerFound', function () {
                    markerVisible = true;
                    finishLoading();
                });
                target.addEventListener('markerLost', function () {
                    markerVisible = false;
                    if (trackingReady && gifReady && !document.getElementById('loading')) {
                        // Keep the camera unobstructed when tracking is temporarily lost.
                        console.info('Affiche perdue : recadrez l’affiche.');
                    }
                });
            });

            window.addEventListener('camera-error', function () {
                var loader = document.getElementById('loading');
                if (loader) loader.textContent =
                    'Autorisez la caméra dans Safari, puis rechargez la page.';
            });
        })();
    </script>
</head>
<body>
    <div id="loading" role="status" aria-live="polite">Chargement, veuillez patienter…</div>

    <a-scene
        embedded
        xr-mode-ui="enabled: false"
        loading-screen="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: medium"
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false">
        <a-nft
            type="nft"
            url="assets/a"
            smooth="true"
            smooth-count="10"
            smooth-tolerance="0.01"
            smooth-threshold="5">
            <!-- GIF at its original aspect ratio, centered just above the poster. -->
            <a-plane
                id="paoli-gif"
                animated-gif="src: assets/paoli-corte.gif"
                width="285"
                height="282.935"
                position="154.82 1 -206.43"
                rotation="-90 0 0"
                material="shader: flat; side: double; transparent: true">
            </a-plane>
        </a-nft>
        <a-entity camera="near: 0.1; far: 10000"></a-entity>
    </a-scene>
</body>
</html>
